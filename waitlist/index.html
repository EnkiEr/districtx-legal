  "ko": {"storeT": "App Store에서 다운로드", "storeS": "iPhone에서 무료", "lead": "어느 날 밤 도시의 불이 꺼지고, 갱단들이 도시를 구역별로 나눠 차지했습니다. 보스가 되어 전설적인 크루를 모으고, 구역을 키우고, 동맹과 함께 도시를 정복하세요. iPhone용 무료 전략 게임입니다.", "discord": "Discord 참여하기", "sound": "🔊 소리 켜기", "h2a": "너의 거리, 너의 규칙.", "c1t": "구역을 건설하라", "c1": "발전소, 주조소, 연구소, 기계 공방. 모든 건물이 당신의 제국을 강하게 만듭니다.", "c2t": "전술적으로 싸워라", "c2": "빠른 육각형 전투. 측면을 노리고, 영웅 스킬을 쓰고, 기계 병기를 투입하세요.", "c3t": "도시를 정복하라", "c3": "실제 플레이어와 함께하는 살아있는 지도. 최대 99명의 동맹, 공동 연구, 월드 보스, 수도 쟁탈전.", "h2b": "크루를 모아라", "h2c": "친구에게 알리기", "copy": "링크 복사", "copied": "복사됨!", "text": "DistrictX: Rise of the Boss — 보스가 되어 나와 함께 도시를 정복하자. iPhone에서 무료:", "privacy": "개인정보 처리방침", "help": "도움말"},
  "ar": {"storeT": "حمّلها من App Store", "storeS": "مجانًا على iPhone", "lead": "في إحدى الليالي انطفأت أنوار المدينة وقسّمتها العصابات إلى أحياء. كن الزعيم، واجمع طاقمًا أسطوريًا، وطوّر حيّك، واستولِ على المدينة مع تحالفك. لعبة استراتيجية مجانية على iPhone.", "discord": "انضم إلى Discord", "sound": "🔊 تشغيل الصوت", "h2a": "شارعك. قواعدك.", "c1t": "ابنِ حيّك", "c1": "محطة طاقة، مسبك، مختبر، ورشة آلات. كل مبنى يقوّي إمبراطوريتك.", "c2t": "قاتل بذكاء", "c2": "معارك سريعة على خلايا سداسية. التفّ على العدو، واستخدم مهارات الأبطال، وأطلق آلاتك.", "c3t": "استولِ على المدينة", "c3": "خريطة حيّة مع لاعبين حقيقيين. تحالفات حتى 99 لاعبًا، أبحاث مشتركة، زعماء عالميون، والقتال على العاصمة.", "h2b": "اجمع طاقمك", "h2c": "أخبر أصدقاءك", "copy": "نسخ الرابط", "copied": "تم النسخ!", "text": "DistrictX: Rise of the Boss — كن الزعيم واستولِ على المدينة معي. مجانًا على iPhone:", "privacy": "سياسة الخصوصية", "help": "المساعدة"},

};
const PAGE = "https://districtx-legal.pages.dev/waitlist/";
function detectLang() {
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && T[asked]) return asked;
  for (const raw of (navigator.languages || [navigator.language || "en"])) {
    const l = raw.toLowerCase();
    if (l.startsWith("pl")) return "pl";
    if (l.startsWith("zh")) return /hant|tw|hk|mo/.test(l) ? "zh-Hant" : "zh-Hans";
    if (l.startsWith("ko")) return "ko";
    if (l.startsWith("ar")) return "ar";
    if (l.startsWith("he") || l.startsWith("iw")) return "he";
    if (l.startsWith("en")) return "en";
  }
  return "en";
}
let lang = detectLang();
function apply() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar" || lang === "he") ? "rtl" : "ltr";
  const v = document.getElementById("promo"), want = "media/promo_" + lang + ".mp4";
  if (v && !v.src.endsWith(want)) { v.src = want; v.play().catch(() => {}); }
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t[el.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  const q = encodeURIComponent, url = PAGE + "?src=share", text = t.text;
  const links = [
    ["X", `https://x.com/intent/post?text=${q(text)}&url=${q(url)}`],
    ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${q(url)}`],
    ["WhatsApp", `https://wa.me/?text=${q(text + " " + url)}`],
    ["Telegram", `https://t.me/share/url?url=${q(url)}&text=${q(text)}`],
    ["Reddit", `https://www.reddit.com/submit?url=${q(url)}&title=${q(text)}`],
    ["Threads", `https://www.threads.net/intent/post?text=${q(text + " " + url)}`],
    ["LINE", `https://line.me/R/share?text=${q(text + " " + url)}`],
    ["Weibo", `https://service.weibo.com/share/share.php?url=${q(url)}&title=${q(text)}`]
  ];
  document.getElementById("share").innerHTML = links.map(([n, h]) => `<a href="${h}" target="_blank" rel="noopener">${n}</a>`).join("")
    + (navigator.share ? `<button id="native">⋯</button>` : "") + `<button id="copy">${t.copy}</button>`;
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(text + " " + url); document.getElementById("copy").textContent = t.copied; } catch (e) {} };
  const native = document.getElementById("native");
  if (native) native.onclick = () => navigator.share({ title: "DistrictX", text, url }).catch(() => {});
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; apply(); });
apply();

const video = document.getElementById("promo"), unmute = document.getElementById("unmute");
unmute.onclick = () => { video.muted = false; video.currentTime = 0; video.play(); unmute.remove(); };
video.addEventListener("volumechange", () => { if (!video.muted) unmute.remove(); });
