function fillCountries(t) {
  const sel = document.getElementById("country"), prev = sel.value;
  const guess = prev || ((navigator.language || "").split("-")[1] || ({ pl: "PL", ko: "KR", "zh-Hant": "TW", he: "IL" }[lang] || "")).toUpperCase();
  let names; try { names = new Intl.DisplayNames([lang], { type: "region" }); } catch (e) { names = { of: c => c }; }
  const list = CODES.map(c => [c, names.of(c) || c]).sort((a, b) => a[1].localeCompare(b[1], lang));
  sel.innerHTML = `<option value="" disabled ${CODES.includes(guess) ? "" : "selected"}>${t.country}</option>`
    + list.map(([c, n]) => `<option value="${c}" ${c === guess ? "selected" : ""}>${n}</option>`).join("");
}
function detectLang() {
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && T[asked]) return asked;
  for (const raw of (navigator.languages || [navigator.language || "en"])) {
    const l = raw.toLowerCase();
    if (l.startsWith("pl")) return "pl";
    if (l.startsWith("zh")) return /hant|tw|hk|mo/.test(l) ? "zh-Hant" : "zh-Hans";
    if (l.startsWith("ko")) return "ko";
    if (l.startsWith("ar")) return "ar";

}
