<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DistrictX: Rise of the Boss</title>
<meta name="description" content="DistrictX: Rise of the Boss – a free strategy game for iPhone. Become the Boss, build your crew of heroes and take the city with your alliance.">
<meta property="og:type" content="video.other">
<meta property="og:title" content="DistrictX: Rise of the Boss">
<meta property="og:description" content="Become the Boss. Build your crew. Take the city. Free on iPhone.">
<meta property="og:url" content="https://enkier.github.io/districtx-legal/waitlist/">

<meta property="og:video:width" content="720">
<meta property="og:video:height" content="1280">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DistrictX: Rise of the Boss">
<meta name="twitter:description" content="Become the Boss. Build your crew. Take the city. Free on iPhone.">
<meta name="twitter:image" content="https://enkier.github.io/districtx-legal/waitlist/media/poster.jpg">
<style>
  :root { --bg:#07090d; --panel:#10161e; --fg:#eef3f8; --muted:#97a8ba; --cyan:#3fd0ff; --amber:#ffb547; --line:#1d2834; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .lang { position:absolute; top:14px; right:16px; z-index:3; display:flex; gap:4px; }
  .lang button { width:42px; background:rgba(10,14,20,.7); color:var(--muted); border:1px solid var(--line); padding:4px 10px; border-radius:99px; font-weight:700; font-size:13px; }
  .lang button.on { color:#00121c; background:var(--cyan); border-color:var(--cyan); }
  .hero { position:relative; min-height:92vh; display:grid; place-items:center; padding:56px 16px 32px; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; background:url(media/bg.jpg) center/cover; filter:brightness(.35) saturate(1.2); transform:scale(1.08); animation:drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:scale(1.18) translateY(-2%); } }
  .hero-inner { position:relative; max-width:1040px; width:100%; display:grid; gap:28px; grid-template-columns:1fr; align-items:center; }
  @media (min-width:820px) { .hero-inner { grid-template-columns:1.1fr .9fr; } }
  h1 { font-size:clamp(40px, 8vw, 72px); line-height:1; margin:0; letter-spacing:1px; text-shadow:0 0 24px rgba(63,208,255,.55); }
  .sub { color:var(--amber); font-weight:700; letter-spacing:4px; text-transform:uppercase; margin:8px 0 16px; }
  .lead { color:#cfdae5; font-size:18px; max-width:520px; }
  .cta { display:inline-flex; align-items:center; gap:10px; margin-top:20px; padding:15px 24px; border-radius:14px; background:linear-gradient(135deg, #ffc54a, #ffb020); color:#1a1000; font-weight:800; text-decoration:none; box-shadow:0 0 30px rgba(255,176,32,.35); }
  .cta small { display:block; font-weight:600; opacity:.8; font-size:12px; }
  form { display:grid; gap:10px; grid-template-columns:1fr 1fr; margin-top:22px; max-width:520px; }
  .choice { grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .choice label { display:flex; flex-direction:column; justify-content:center; min-height:76px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:rgba(10,14,20,.85); cursor:pointer; font-weight:800; line-height:1.25; }
  .choice label small { font-weight:500; color:var(--muted); font-size:12px; margin-top:4px; }
  @media (max-width:600px) { .choice label { min-height:118px; } }
  .choice input { position:absolute; opacity:0; pointer-events:none; }
  .choice label:has(input:checked) { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 0 24px rgba(255,176,32,.25); }
  input[type=email], select { grid-column:1 / -1; min-width:0; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:rgba(10,14,20,.85); color:var(--fg); font:inherit; }
  select { grid-column:auto; }
  button.go { min-width:0; padding:14px 16px; border:0; border-radius:12px; background:linear-gradient(135deg, #ffc54a, #ffb020); color:#1a1000; font:inherit; font-weight:800; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .discord { display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; width:100%; max-width:520px; padding:12px 16px; border-radius:12px; background:#5865f2; color:#fff; font-weight:800; text-decoration:none; }
  button:disabled { opacity:.6; }
  .note { color:var(--muted); font-size:13px; margin-top:8px; }
  .ok { color:#5ff0a0; font-weight:700; } .err { color:#ff7b86; }
  .player { position:relative; justify-self:center; width:100%; max-width:360px; }
  video { width:100%; border-radius:24px; border:1px solid rgba(63,208,255,.4); box-shadow:0 0 60px rgba(63,208,255,.25); background:#000; display:block; }
  .unmute { position:absolute; left:50%; bottom:64px; transform:translateX(-50%); background:rgba(5,7,11,.8); color:#fff; border:1px solid rgba(63,208,255,.6); border-radius:99px; padding:8px 16px; font-weight:700; cursor:pointer; }
  section { max-width:1040px; margin:0 auto; padding:56px 16px; }
  h2 { font-size:28px; margin:0 0 20px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .card img { width:100%; height:220px; object-fit:cover; display:block; }
  .card div { padding:14px 16px 18px; } .card h3 { margin:0 0 6px; font-size:18px; } .card p { margin:0; color:var(--muted); }
  .crew { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .crew img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:14px; border:1px solid var(--line); }
  .share { display:flex; gap:8px; flex-wrap:wrap; }
  .share a, .share button { min-width:96px; text-align:center; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); text-decoration:none; font:inherit; font-weight:600; font-size:14px; cursor:pointer; }
  footer { text-align:center; color:var(--muted); padding:32px 16px 48px; font-size:14px; } footer a { color:var(--cyan); }
</style>
</head>
<body>
<div class="lang"><button data-l="en">EN</button><button data-l="pl">PL</button></div>
<header class="hero">
  <div class="hero-inner">
    <div>
      <h1>DISTRICT X</h1>
      <div class="sub">Rise of the Boss</div>
      <p class="lead" data-t="lead"></p>
      <form id="wl">
        <div class="choice">
          <label><input type="radio" name="kind" value="beta" checked><span data-t="betaT"></span><small data-t="betaS"></small></label>
          <label><input type="radio" name="kind" value="launch"><span data-t="launchT"></span><small data-t="launchS"></small></label>
        </div>
        <input id="email" type="email" required autocomplete="email" data-ph="email">
        <select id="country" required aria-label="Country"></select>
        <button class="go" id="go" type="submit" data-t="join"></button>
      </form>
      <div id="msg" class="note" data-t="note"></div>
      <a class="discord" href="https://discord.gg/rHyrmC7Z42" target="_blank" rel="noopener">💬 <span data-t="discord"></span></a>
    </div>
    <div class="player">
      <video id="promo" src="media/promo.mp4" poster="media/poster.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
      <button class="unmute" id="unmute" data-t="sound"></button>
    </div>
  </div>
</header>

<section>
  <h2 data-t="h2a"></h2>
  <div class="grid">
    <div class="card"><img src="media/city.jpg" alt=""><div><h3 data-t="c1t"></h3><p data-t="c1"></p></div></div>
    <div class="card"><img src="media/battle.jpg" alt=""><div><h3 data-t="c2t"></h3><p data-t="c2"></p></div></div>
    <div class="card"><img src="media/map.jpg" alt=""><div><h3 data-t="c3t"></h3><p data-t="c3"></p></div></div>
  </div>
</section>

<section>
  <h2 data-t="h2b"></h2>
  <div class="crew">
    <img src="media/hero_vance.jpg" alt="Vance"><img src="media/hero_nyx.jpg" alt="Nyx"><img src="media/hero_vega.jpg" alt="Vega"><img src="media/hero_orion.jpg" alt="Orion">
  </div>
</section>

<section>
  <h2 data-t="h2c"></h2>
  <div class="share" id="share"></div>
</section>

<footer>
  © DistrictX · <a href="../privacy.html" data-t="privacy"></a> · <a href="../index.html" data-t="help"></a>
</footer>

<script>
const T = {
  en: {
    lead: "One night the city went dark and gangs tore it into districts. Become the Boss, build a legendary crew, grow your district and take the city with your alliance. A free strategy game for iPhone.",
    betaT: "Join the beta", betaS: "Play now on iPhone (TestFlight)", launchT: "Notify me at launch", launchS: "One e-mail when it's in your App Store",
    email: "Your e-mail", country: "Your country", join: "Sign me up", discord: "Join our Discord",
    note: "Beta places are limited. We'll e-mail you an invite once you're approved. No spam.",
    ok: "You're on the list! We'll let you know at launch.", okBeta: "Thanks! Once you're approved, Apple will e-mail you a TestFlight invite.",
    bad: "Couldn't sign you up. Check the address and try again.", sound: "🔊 Sound on",
    h2a: "Your street. Your rules.", c1t: "Build your district", c1: "Power plant, foundry, lab, machine workshop. Every building powers up your empire.",
    c2t: "Fight tactically", c2: "Fast hex battles. Flank, use hero skills and send in your machines.",
    c3t: "Take the city", c3: "A living map with real players. Alliances of up to 99, shared research, world bosses and the fight for the Capital.",
    h2b: "Build your crew", h2c: "Tell your friends", copy: "Copy link", copied: "Copied!",
    text: "DistrictX: Rise of the Boss — become the Boss and take the city with me. Free on iPhone:",
    privacy: "Privacy policy", help: "Help"
  },
  pl: {
    lead: "Pewnej nocy miasto zgasło, a gangi przejęły dzielnice. Zostań Bossem, zbierz legendarną ekipę, rozbuduj swoją dzielnicę i podbij miasto z sojuszem. Darmowa gra strategiczna na iPhone'a.",
    betaT: "Dołącz do bety", betaS: "Graj już teraz na iPhonie (TestFlight)", launchT: "Powiadom o premierze", launchS: "Jeden e-mail, gdy gra będzie w Twoim App Store",
    email: "Twój e-mail", country: "Twój kraj", join: "Zapisz mnie", discord: "Dołącz do naszego Discorda",
    note: "Liczba miejsc w becie jest ograniczona. Po akceptacji wyślemy zaproszenie e-mailem. Bez spamu.",
    ok: "Jesteś na liście! Damy znać w dniu premiery.", okBeta: "Dzięki! Po akceptacji Apple wyśle Ci e-mailem zaproszenie do TestFlight.",
    bad: "Nie udało się zapisać. Sprawdź adres e-mail i spróbuj ponownie.", sound: "🔊 Włącz dźwięk",
    h2a: "Twoja ulica. Twoje zasady.", c1t: "Buduj dzielnicę", c1: "Elektrownia, odlewnia, laboratorium, warsztat maszyn. Każdy budynek wzmacnia Twoje imperium.",
    c2t: "Walcz taktycznie", c2: "Szybkie bitwy na heksach. Flankuj, używaj umiejętności bohaterów i wysyłaj do boju maszyny.",
    c3t: "Podbijaj miasto", c3: "Żywa mapa z prawdziwymi graczami. Sojusze do 99 osób, wspólne badania, bossowie świata i walka o stolicę.",
    h2b: "Zbierz ekipę", h2c: "Poleć znajomym", copy: "Kopiuj link", copied: "Skopiowano!",
    text: "DistrictX: Rise of the Boss — zostań Bossem i podbij miasto ze mną. Za darmo na iPhone:",
    privacy: "Polityka prywatności", help: "Pomoc"
  }
};
const PAGE = "https://enkier.github.io/districtx-legal/waitlist/";
const CODES = "AD AE AF AG AI AL AM AO AR AT AU AW AZ BA BB BD BE BF BG BH BI BJ BM BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CO CR CV CY CZ DE DJ DK DM DO DZ EC EE EG ES ET FI FJ FM FR GA GB GD GE GH GM GN GR GT GW GY HK HN HR HU ID IE IL IN IQ IS IT JM JO JP KE KG KH KN KR KW KY KZ LA LB LC LI LK LR LT LU LV LY MA MC MD ME MG MK ML MM MN MO MR MS MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PS PT PW PY QA RO RS RW SA SB SC SE SG SI SK SL SN SR ST SV SZ TC TD TG TH TJ TM TN TO TR TT TW TZ UA UG US UY UZ VC VE VG VN VU WS XK YE ZA ZM ZW".split(" ");
function fillCountries(t) {
  const sel = document.getElementById("country"), prev = sel.value;
  const guess = prev || ((navigator.language || "").split("-")[1] || (lang === "pl" ? "PL" : "")).toUpperCase();
  let names; try { names = new Intl.DisplayNames([lang], { type: "region" }); } catch (e) { names = { of: c => c }; }
  const list = CODES.map(c => [c, names.of(c) || c]).sort((a, b) => a[1].localeCompare(b[1], lang));
  sel.innerHTML = `<option value="" disabled ${CODES.includes(guess) ? "" : "selected"}>${t.country}</option>`
    + list.map(([c, n]) => `<option value="${c}" ${c === guess ? "selected" : ""}>${n}</option>`).join("");
}
let lang = new URLSearchParams(location.search).get("lang") || ((navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en");
function apply() {
  const t = T[lang];
  document.documentElement.lang = lang;
  const v = document.getElementById("promo"), want = "media/promo_" + lang + ".mp4";
  if (v && !v.src.endsWith(want)) { v.src = want; v.play().catch(() => {}); }
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t[el.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  fillCountries(t);
  const q = encodeURIComponent, url = PAGE + "?src=share", text = t.text;
  const links = [
    ["X", `https://x.com/intent/post?text=${q(text)}&url=${q(url)}`],
    ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${q(url)}`],
    ["WhatsApp", `https://wa.me/?text=${q(text + " " + url)}`],
    ["Telegram", `https://t.me/share/url?url=${q(url)}&text=${q(text)}`],
    ["Reddit", `https://www.reddit.com/submit?url=${q(url)}&title=${q(text)}`],
    ["Threads", `https://www.threads.net/intent/post?text=${q(text + " " + url)}`],
    ["LINE", `https://line.me/R/share?text=${q(text + " " + url)}`],
    ["Weibo", `https://service.weibo.com/share/share.php?url=${q(url)}&title=${q(text)}`]
  ];
  document.getElementById("share").innerHTML = links.map(([n, h]) => `<a href="${h}" target="_blank" rel="noopener">${n}</a>`).join("")
    + (navigator.share ? `<button id="native">⋯</button>` : "") + `<button id="copy">${t.copy}</button>`;
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(text + " " + url); document.getElementById("copy").textContent = t.copied; } catch (e) {} };
  const native = document.getElementById("native");
  if (native) native.onclick = () => navigator.share({ title: "DistrictX", text, url }).catch(() => {});
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; apply(); });
apply();

const video = document.getElementById("promo"), unmute = document.getElementById("unmute");
unmute.onclick = () => { video.muted = false; video.currentTime = 0; video.play(); unmute.remove(); };
video.addEventListener("volumechange", () => { if (!video.muted) unmute.remove(); });

const URL_ = "https://psawewkmzwnzxbaygxrq.supabase.co/rest/v1/rpc/join_waitlist";
const KEY = "sb_publishable_5QGx9Jwr_noPTJIcU-_A5A_vpwgppsz";
document.getElementById("wl").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const beta = document.querySelector("input[name=kind]:checked").value === "beta";
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  go.disabled = true;
  try {
    const src = new URLSearchParams(location.search).get("src") || "landing";
    const r = await fetch(URL_, { method: "POST", headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_email: email, p_language: (navigator.language || lang).slice(0, 5), p_source: src,
                             p_country: document.getElementById("country").value || null, p_beta: beta }) });
    if (!r.ok) throw new Error(await r.text());
    msg.className = "note ok"; msg.textContent = beta ? T[lang].okBeta : T[lang].ok;
    document.getElementById("email").value = "";
  } catch (err) {
    msg.className = "note err"; msg.textContent = T[lang].bad;
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
